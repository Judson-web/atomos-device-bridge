[package]
name = "atomos_mls_bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
name = "atomos_mls_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.21.1"
openmls = { version = "=0.9.2", features = ["openmls_rust_crypto"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive", "serde", "mls"] }
hex = "=0.4.3"
base64 = "=0.22.1"
openmls_sqlite_storage = "=0.3.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
openmls_traits = "=0.6.0"
chacha20poly1305 = "=0.10.1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
zeroize = "=1.9.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
