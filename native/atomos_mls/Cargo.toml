[package]
name = "atomos_mls_bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
name = "atomos_mls_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.21.1"
openmls = { version = "=0.9.2", features = ["openmls_rust_crypto"] }
openmls_rust_crypto = "=0.6.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
