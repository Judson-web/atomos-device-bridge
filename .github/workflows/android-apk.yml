name: Build Android APK

on:
  push:
    branches: [main, develop, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 17 SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -d "$ANDROID_HOME/platforms/android-37.0" || ! -d "$ANDROID_HOME/build-tools/37.0.0" ]]; then
            set +o pipefail
            yes | "$SDKMANAGER" --licenses >/dev/null
            set -o pipefail
            "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          else
            echo "Android SDK 37.0 and Build Tools 37.0.0 already installed; skipping download."
          fi

      - name: Install Android NDK for OpenMLS
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust 1.91 and Android targets
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Resolve and test OpenMLS native bridge
        working-directory: native/atomos_mls
        run: |
          cargo generate-lockfile
          cargo test --locked

      - name: Build OpenMLS native libraries for Android
        working-directory: native/atomos_mls
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/armv7a-linux-androideabi24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/x86_64-linux-android24-clang"

          cargo build --locked --release --target aarch64-linux-android
          cargo build --locked --release --target armv7-linux-androideabi
          cargo build --locked --release --target x86_64-linux-android

          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../../app/src/main/jniLibs/armeabi-v7a
          mkdir -p ../../app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libatomos_mls_bridge.so ../../app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libatomos_mls_bridge.so ../../app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libatomos_mls_bridge.so ../../app/src/main/jniLibs/x86_64/

      - name: Set up Gradle 9.3.1 with dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Cache Gradle configuration
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: gradle-config-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: |
            gradle-config-${{ runner.os }}-

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
            if [[ -z "$VERSION" ]]; then
              echo "::error::Could not read versionName from app/build.gradle.kts"
              exit 1
            fi
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION ($TAG)"

      - name: Prevent duplicate automatic release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. Bump versionName in app/build.gradle.kts before merging another release."
            exit 1
          fi

      - name: Validate release signing secrets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGNING_KEY STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret for release signing: $name"
              exit 1
            fi
          done

      - name: Restore private release keystore
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > app/release-key.jks
          test -s app/release-key.jks

      - name: Build debug APK
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/gradle-debug-$attempt.log"
            echo "Debug APK build attempt $attempt/3"
            if gradle --no-daemon --parallel --build-cache --configuration-cache :app:assembleDebug 2>&1 | tee "$log"; then
              exit 0
            else
              status=${PIPESTATUS[0]}
            fi
            if ! grep -Eiq 'Could not (GET|HEAD)|status code 5[0-9]{2}|HTTP response code: 5[0-9]{2}|Gateway Time-out|Connection reset|timed out' "$log"; then
              exit "$status"
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 20))
              echo "Transient dependency/network failure detected; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::Gradle dependency resolution failed after 3 attempts."
          exit 1

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/gradle-release-$attempt.log"
            echo "Release APK build attempt $attempt/3"
            if gradle --no-daemon --parallel --build-cache --configuration-cache :app:assembleRelease 2>&1 | tee "$log"; then
              exit 0
            else
              status=${PIPESTATUS[0]}
            fi
            if ! grep -Eiq 'Could not (GET|HEAD)|status code 5[0-9]{2}|HTTP response code: 5[0-9]{2}|Gateway Time-out|Connection reset|timed out' "$log"; then
              exit "$status"
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 20))
              echo "Transient dependency/network failure detected; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::Gradle dependency resolution failed after 3 attempts."
          exit 1

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find app/build/outputs/apk/debug -type f -name '*.apk' | wc -l)" -eq 1
          if [[ "$GITHUB_REF" == refs/tags/v* || ("$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main") ]]; then
            test "$(find app/build/outputs/apk/release -type f -name '*.apk' | wc -l)" -eq 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomos-utility-suite-debug-apk
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Atomos Utility Suite ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/**/*.apk
          fail_on_unmatched_files: true
