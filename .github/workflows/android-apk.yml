name: Build Android Debug APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Android images normally include these packages.
      # Only invoke sdkmanager when the required platform/build-tools are absent.
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          else
            echo "Android SDK 35 and Build Tools 35.0.0 already installed; skipping download."
          fi

      - name: Set up Gradle 8.9 with dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      # Configuration cache is project-local, so persist it separately.
      - name: Cache Gradle configuration
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: gradle-config-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: |
            gradle-config-${{ runner.os }}-

      - name: Build debug APK
        run: gradle --no-daemon --parallel --build-cache --configuration-cache :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomos-device-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
