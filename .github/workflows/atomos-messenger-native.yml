name: Atomos Messenger Native Build

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'native/atomos_mls/**'
      - 'app/src/main/java/dev/atomos/bridge/messaging/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/atomos-messenger-native.yml'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main, develop]
    paths:
      - 'native/atomos_mls/**'
      - 'app/src/main/java/dev/atomos/bridge/messaging/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/atomos-messenger-native.yml'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atomos-messenger-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 27.2.12479018
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v5

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust 1.91 and Android targets
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Generate native dependency lockfile
        working-directory: native/atomos_mls
        run: cargo generate-lockfile

      - name: Test native bridge on host
        working-directory: native/atomos_mls
        run: cargo test --locked

      - name: Build OpenMLS bridge for Android ABIs
        working-directory: native/atomos_mls
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/armv7a-linux-androideabi24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/x86_64-linux-android24-clang"

          cargo build --locked --release --target aarch64-linux-android
          cargo build --locked --release --target armv7-linux-androideabi
          cargo build --locked --release --target x86_64-linux-android

          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../../app/src/main/jniLibs/armeabi-v7a
          mkdir -p ../../app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libatomos_mls_bridge.so ../../app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libatomos_mls_bridge.so ../../app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libatomos_mls_bridge.so ../../app/src/main/jniLibs/x86_64/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build Android debug APK with native libraries
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload native bridge and debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atomos-messenger-native-debug
          path: |
            native/atomos_mls/Cargo.lock
            app/src/main/jniLibs/**/*.so
            app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 30
